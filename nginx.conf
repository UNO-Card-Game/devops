server {
    listen 80;

    server_name unogame-dev.org www.unogame-dev.org;
    # Serve the Let's Encrypt ACME challenge for SSL certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        autoindex on;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Logging for troubleshooting
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    
    }
}
server {
    listen 443 ssl;

    server_name unogame-dev.org www.unogame-dev.org;
    ssl_certificate /etc/letsencrypt/live/unogame-dev.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unogame-dev.org/privkey.pem;
    # Serve static files
     location / {
        autoindex on;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Logging for troubleshooting
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    
    }
    
}
