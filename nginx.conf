server {
    listen 80;

    server_name uno-game-dev.org;
    # Serve the Let's Encrypt ACME challenge for SSL certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
   
    # Proxy for HTTP requests (Web Frontend)
    location / {
        proxy_pass http://frontend:3000; # Proxy to React app
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Logging for troubleshooting
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }

    
}
server {
    listen 443 ssl;

    server_name uno-game-dev.org;
    ssl_certificate /etc/letsencrypt/live/uno-game-dev.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uno-game-dev.org/privkey.pem;
    # Proxy for HTTP requests (Web Frontend)
    location / {
        proxy_pass http://frontend:3000; # Proxy to React app
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Logging for troubleshooting
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }

    
}
