server {
    listen 80;

    server_name unogame-dev.org www.unogame-dev.org;
    # Serve the Let's Encrypt ACME challenge for SSL certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        autoindex on;
        root /site;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Logging for troubleshooting
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    
    }
    
    # Uno backend on /api
    location /api/ {
        proxy_pass http://uno_server:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
}
server {
    listen 443 ssl;

    server_name unogame-dev.org www.unogame-dev.org;
    ssl_certificate /etc/letsencrypt/live/unogame-dev.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unogame-dev.org/privkey.pem;
    # Serve static files
     location / {
        autoindex on;
        root /site;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Logging for troubleshooting
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    
    }

    # Uno backend on /api
    location /api/ {
        proxy_pass http://uno_server:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
}
