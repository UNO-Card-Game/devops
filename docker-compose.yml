services:
  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    volumes:
      - /home/ubuntu/uno-react/dist:/site
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/html
      - /home/ubuntu/devops/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    restart: always
    depends_on:
      - certbot
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do sleep 1 & wait $${!}; done"
  uno_server:
    build:
      context: /home/ubuntu/uno
      dockerfile: Dockerfile
    ports:
      - "8000:8000" 
    environment:
      - PORT=8000
    restart: always
    container_name: uno_server