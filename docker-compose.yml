services:
  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    volumes:
      - ./site:/usr/share/nginx/html
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/html
      - app:/usr/share/nginx/html/app
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    restart: always
    depends_on:
      - certbot
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do sleep 1 & wait $${!}; done"
  frontend:
    build:
      context: /home/ubuntu/uno-react # Path to the React project directory
      dockerfile: Dockerfile # Dockerfile inside uno-react directory
    container_name: frontend
    restart: always
    environment:
    - NODE_ENV=production
    volumes:
    - app:/app/dist/ 
    networks:
      - uno-network
  uno_server:
    build:
      context: /home/ubuntu/uno
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - uno-network
    environment:
      - PORT=8000
    restart: always
    container_name: uno_server

networks:
  uno-network:
    driver: bridge
