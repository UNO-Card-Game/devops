services:
  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Mount custom NGINX configuration
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    restart: always
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do sleep 1 & wait $${!}; done"
  frontend:
    build: /home/ubuntu/uno-react
    container_name: frontend
    restart: always
    ports:
      - "3000:80" #map to port 80
    networks:
      - uno-network
  uno_server:
    build:
      context: /home/ubuntu/uno
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - uno-network
    environment:
      - PORT=8000
    restart: always
    container_name: uno_server

networks:
  uno-network:
    driver: bridge
